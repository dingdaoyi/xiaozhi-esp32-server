apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaozhi-redis
  namespace: xiaozhi
  labels:
    app: xiaozhi-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xiaozhi-redis
  template:
    metadata:
      labels:
        app: xiaozhi-redis
    spec:
      containers:
        - name: redis
          image: redis:8.0
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: xiaozhi-redis
  namespace: xiaozhi
spec:
  selector:
    app: xiaozhi-redis
  ports:
    - port: 6379
      targetPort: 6379
